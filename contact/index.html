    <!-- page hero -->
    <div class="page-hero">
      <div class="container">
        <h1>CONTACT</h1>
        <p>お問い合わせ</p>
      </div>
      <div class="scroll">
        <span>Scroll</span>
        <div class="scroll-line"></div>
      </div>
    </div>
    <!-- contact -->
    <section class="contact">
      <div class="container">
        <h2>お問い合わせ</h2>
        <p class="contact-lead">
          ご質問・ご相談など、お気軽にお問い合わせください。
        </p>
        <form action="thanks.html" method="post" class="contact-form">
          <div class="form-group">
            <label>ご担当者様名<span>必須</span></label>
            <div class="name-flex">
              <input type="text" name="last_name" required  placeholder="姓">
              <input type="text" name="first_name" required  placeholder="名">
            </div>
          </div>
          <div class="form-group">
            <label>ご担当者様名（フリガナ）<span>必須</span></label>
            <input type="text" name="contact_name_kana" required>
          </div>
          <div class="form-group">
            <label>会社名<span>必須</span></label>
            <input type="text" name="company_name" required>
          </div>
          <div class="form-group">
            <label>部署名</label>
            <input type="text" name="department_name">
          </div>
          <div class="form-group">
            <label>メールアドレス<span>必須</span></label>
            <input type="email" name="email" required>
          </div>
          <div class="form-group">
            <label>電話番号<span>必須</span></label>
            <input type="tel" name="tel" required>
          </div>
          <div class="form-group">
            <label>郵便番号</label>
            <input type="text" name="postal" placeholder="例：123-4567">
          </div>
          <div class="form-group">
            <label>都道府県</label>
            <select name="prefecture" required>
              <option value="">選択してください</option>
              <option>北海道</option>
              <option>青森県</option>
              <option>岩手県</option>
              <option>宮城県</option>
              <option>秋田県</option>
              <option>山形県</option>
              <option>福島県</option>
              <option>茨城県</option>
              <option>栃木県</option>
              <option>群馬県</option>
              <option>埼玉県</option>
              <option>千葉県</option>
              <option>東京都</option>
              <option>神奈川県</option>
              <option>新潟県</option>
              <option>富山県</option>
              <option>石川県</option>
              <option>福井県</option>
              <option>山梨県</option>
              <option>長野県</option>
              <option>岐阜県</option>
              <option>静岡県</option>
              <option>愛知県</option>
              <option>三重県</option>
              <option>滋賀県</option>
              <option>京都府</option>
              <option>大阪府</option>
              <option>兵庫県</option>
              <option>奈良県</option>
              <option>和歌山県</option>
              <option>鳥取県</option>
              <option>島根県</option>
              <option>岡山県</option>
              <option>広島県</option>
              <option>山口県</option>
              <option>徳島県</option>
              <option>香川県</option>
              <option>愛媛県</option>
              <option>高知県</option>
              <option>福岡県</option>
              <option>佐賀県</option>
              <option>長崎県</option>
              <option>熊本県</option>
              <option>大分県</option>
              <option>宮崎県</option>
              <option>鹿児島県</option>
              <option>沖縄県</option>
            </select>
          </div>
          <div class="form-group">
            <label>市区町村</label>
            <input type="text" name="city" placeholder="例：福岡市中央区">
          </div>
          <div class="form-group">
            <label>番地</label>
            <input type="text" name="address" placeholder="例：1-2-3">
          </div>
          <div class="form-group">
            <label>ビル名・部屋番号</label>
            <input type="text" name="building" placeholder="例：○○ビル 101">
          </div>
          <div class="form-group">
            <label>お問い合わせ種別</label>
            <select name="type">
              <option>選択してください</option>
              <option>御見積について</option>
              <option>試作・量産について</option>
              <option>ご相談</option>
              <option>その他</option>
            </select>
          </div>
          <div class="form-group">
            <label>お問い合わせ内容<span>必須</span></label>
            <textarea name="message" rows="5" required></textarea>
          </div>
          <div class="privacy-box">
            <p>
              当社は、お問い合わせにより取得した個人情報を適切に管理し、
              ご本人の同意なく第三者へ提供することはありません。
              詳細は「
              <a href="../privacy/" target="_blank" rel="noopener noreferrer">
                プライバシーポリシー
              </a>
              」をご確認ください。
            </p>
            <div class="privacy-check">
              <input type="checkbox" id="privacy" required>
              <label for="privacy">
                プライバシーポリシーに同意する<span>必須</span>
              </label>
            </div>
          </div>
          <button type="submit" onclick="return confirmForm()">送信する</button>
        </form>
      </div>
    </section>
